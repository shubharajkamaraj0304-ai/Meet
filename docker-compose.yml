services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
  api:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/intellmeet
      CLIENT_URL: http://localhost:8080
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your environment}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "5000:5000"
    depends_on:
      - mongo
  web:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:5000/api
        VITE_SOCKET_URL: http://localhost:5000
    ports:
      - "8080:80"
    depends_on:
      - api
volumes:
  mongo_data:
